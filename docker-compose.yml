services:
  # The Go Vector Engine (Stateful Worker Nodes)
  db:
    build: 
      context: ./db
    # We do NOT expose the 50051 port directly to your Mac here 
    # because we are running multiple replicas. The API container 
    # will talk to them internally over the Docker network.
    networks:
      vector-network:
        aliases:
          # This perfectly mimics your K8s headless service DNS!
          - vector-worker-headless.default.svc.cluster.local
    deploy:
      mode: replicated
      replicas: 3 # Spins up 3 Go nodes so you can test parallel scatter-gather locally

  # The Python FastAPI Gateway (Stateless)
  api:
    build: 
      context: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - vector-network

  # The React + Tailwind Frontend
  frontend:
    build: 
      context: ./frontend
    ports:
      # Assuming Vite's default port. Change to 3000 if using Create React App.
      - "5173:5173"
    environment:
      # Pass the Gateway API URL to the React frontend
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - vector-network

networks:
  vector-network:
    driver: bridge