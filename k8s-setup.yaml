---
# 1. Headless Service for Go Database Workers
apiVersion: v1
kind: Service
metadata:
  name: vector-worker-headless
  namespace: default 
spec:
  clusterIP: None
  selector:
    app: vector-worker
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051

---
# 2. Deployment for Go Database Workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-worker-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vector-worker
  template:
    metadata:
      labels:
        app: vector-worker
    spec:
      containers:
        - name: vector-worker
          image: 2000023946/vectorengine-db:latest 
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
          resources:
            requests:
              cpu: "100m"      # 1/10th of a CPU core
              memory: "128Mi"
            limits:
              cpu: "250m"      # Max 1/4th of a core
              memory: "256Mi"

---
# 3. LoadBalancer Service for Python API Gateway
apiVersion: v1
kind: Service
metadata:
  name: vector-api-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: vector-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
# 4. Deployment for Python API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-api-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-api
  template:
    metadata:
      labels:
        app: vector-api
    spec:
      containers:
        - name: vector-api
          image: 2000023946/vectorengine-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# 5. Autoscaler for Go Workers (Scales 3 to 10 pods)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vector-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vector-worker-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# 6. Autoscaler for API Gateway (Scales 2 to 5 pods)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vector-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vector-api-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70