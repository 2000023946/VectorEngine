# 1. Headless Service for Go Database Workers
apiVersion: v1
kind: Service
metadata:
  name: vector-worker-headless
  namespace: default 
spec:
  clusterIP: None
  selector:
    app: vector-worker
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051

---
# 2. Deployment for Go Database Workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-worker-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vector-worker
  template:
    metadata:
      labels:
        app: vector-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: vector-worker
          image: 2000023946/vectorengine-db:latest 
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 2112
              name: metrics
          resources:
            requests:
              cpu: "100m"      # 1/10th of a CPU core
              memory: "128Mi"
            limits:
              cpu: "500m"      # Expanded headroom for high-load vector search
              memory: "512Mi"

---
# 3. LoadBalancer Service for Python API Gateway
apiVersion: v1
kind: Service
metadata:
  name: vector-api-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: vector-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
# 4. Deployment for Python API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-api-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-api
  template:
    metadata:
      labels:
        app: vector-api
    spec:
      containers:
        - name: vector-api
          image: 2000023946/vectorengine-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# 5. KEDA ScaledObject for Go Workers (Request-Driven Scaling)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vector-worker-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vector-worker-deployment
  minReplicaCount: 3
  maxReplicaCount: 12
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-service.default.svc.cluster.local:9090
        metricName: grpc_requests_total
        query: sum(rate(grpc_requests_total[1m]))
        threshold: '50'

---
# 6. Autoscaler for API Gateway (Scales 2 to 6 pods on CPU pressure)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vector-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vector-api-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60